# Publica apps/pesca (menos servidor/) en la rama gh-pages (GitHub Pages)
# cada vez que cambia en main. El sitio queda en https://luchito1987.github.io/claude-code/
name: Publicar semáforo de pesca

on:
  push:
    branches: [main]
    paths:
      - 'apps/pesca/**'
      - '.github/workflows/pesca-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pesca-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar la app a gh-pages
        run: |
          set -euo pipefail
          # Todo apps/pesca menos el servidor (que corre en la máquina de casa).
          SITIO="$RUNNER_TEMP/sitio"
          mkdir -p "$SITIO"
          tar -C apps/pesca --exclude=./servidor -cf - . | tar -C "$SITIO" -xf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git switch -C gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          # Reemplaza el contenido publicado por el de esta versión.
          git rm -rq --ignore-unmatch . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SITIO/." ./
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages ya tiene esta versión; no hay nada que publicar."
            exit 0
          fi
          git commit -m "Publica apps/pesca desde ${GITHUB_SHA::7}"
          git push origin gh-pages
