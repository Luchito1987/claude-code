name: CI

# Este CI mide el código del CLI (src/, web/ y sus scripts de build). Corre sólo
# cuando ese código cambia: sin los `paths` se disparaba también en los cambios
# de apps/finanzas, que no tiene nada que ver, y fallaba por errores ajenos al
# PR — un rojo permanente que no decía nada sobre lo que se estaba revisando.
# La app de finanzas tiene su propio workflow en finanzas.yml.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Biome check (src/)
        run: bun run lint

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: ESLint (web/)
        working-directory: web
        run: bun run lint

  # ── Type-check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck root
        run: bun run typecheck

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck web
        working-directory: web
        run: bun run type-check

  # ── Security Audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Audit root dependencies
        run: bun audit --production
        continue-on-error: true  # promote to required once baseline is clean

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit web dependencies
        working-directory: web
        run: bun audit --production
        continue-on-error: true

  # ── Build Web ─────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # `bun run build:web` (raíz) es el esbuild del terminal embebido y no
      # produce ningún .next. El artefacto que este job sube, y el presupuesto
      # de bundle que mide el job siguiente, salen del `next build` de web/.
      - name: Build web app
        working-directory: web
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: web/.next/
          retention-days: 7

  # ── Bundle Size Gate ──────────────────────────────────────────────────────
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Este job corre en su propia máquina, con un checkout limpio: sin bajar
      # el artefacto no hay .next que medir y el presupuesto se cumplía sobre
      # un directorio vacío.
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: web/.next/

      - name: Check initial JS bundle < 150 KB gzipped
        working-directory: web
        run: |
          # "First Load JS": los chunks que el navegador baja para pintar la
          # primera pantalla, que es lo que este presupuesto quiere acotar. El
          # comando anterior sumaba todo .next/static/chunks, lazy incluidos:
          # 2,3 MB contra un tope de 150 KB, midiendo otra cosa que la enunciada.
          FILES=$(node -p "require('./.next/build-manifest.json').rootMainFiles.map(f => '.next/' + f).join(' ')")
          BUNDLE_SIZE=$(echo "$FILES" | xargs gzip -c | wc -c)
          BUDGET_BYTES=153600
          echo "First Load JS gzipped: ${BUNDLE_SIZE} bytes"
          if [ "$BUNDLE_SIZE" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Bundle size ${BUNDLE_SIZE}B exceeds 150 KB budget (${BUDGET_BYTES}B)"
            exit 1
          fi

