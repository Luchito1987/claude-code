<text x="400" y="1335" font-size="16" fill="#d6453d" text-anchor="start" font-weight="bold">sale por aquí</text>
<rect x="30" y="1510" width="740" height="255" rx="16" fill="#fff" stroke="#e1dbcf" stroke-width="2"/>
<circle cx="70" cy="1548" r="21" fill="#d6453d"/>
