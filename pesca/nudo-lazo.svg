<text x="104" y="738" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Mete la punta por dentro del nudo simple</text>
<text x="104" y="764" font-size="17" fill="#5a6470" text-anchor="start">Por el mismo lado por donde sale el nylon.</text>
