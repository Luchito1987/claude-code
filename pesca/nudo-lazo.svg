<text x="470" y="1747" font-size="17" fill="#2e7d4f" text-anchor="start" font-weight="bold">✓ el señuelo se mueve libre</text>
<rect x="30" y="1780" width="740" height="100" rx="14" fill="#fff" stroke="#d9d3c7" stroke-width="2"/>
<text x="400" y="1814" font-size="18" fill="#1f2a36" text-anchor="middle">Antes de apretar del todo, desliza el nudo simple hacia el señuelo</text>
<text x="400" y="1840" font-size="18" fill="#1f2a36" text-anchor="middle">para que el lazo quede chico: así el anzuelo no se engancha en él.</text>
