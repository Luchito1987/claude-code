<text x="104" y="1548" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Moja, ajusta el lazo y aprieta</text>
<text x="104" y="1574" font-size="17" fill="#5a6470" text-anchor="start">Deja el lazo de 0,5–1 cm. Corta la punta a 3 mm.</text>
