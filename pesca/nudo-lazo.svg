<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1900" viewBox="0 0 800 1900" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d6453d"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0822e"/></marker></defs>
<rect width="800" height="1900" fill="#f7f4ee"/>
<text x="400" y="56" text-anchor="middle" font-size="35" font-weight="bold" fill="#1f2a36">Nudo de lazo (Non-Slip Loop)</text>
<text x="400" y="92" text-anchor="middle" font-size="20" fill="#5a6470">Para atar el señuelo al líder dejando que se mueva libre</text>
<rect x="200" y="108" width="400" height="34" rx="17" fill="#fff" stroke="#e1dbcf"/>
<path d="M222 125 L262 125" fill="none" stroke="#3d6e91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="270" y="131" font-size="16" fill="#1f2a36" text-anchor="start">nylon (hacia el girador)</text>
<path d="M455 125 L485 125" fill="none" stroke="#e0822e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="492" y="131" font-size="16" fill="#1f2a36" text-anchor="start">la punta</text>
<rect x="30" y="160" width="740" height="255" rx="16" fill="#fff" stroke="#e1dbcf" stroke-width="2"/>
<circle cx="70" cy="198" r="21" fill="#d6453d"/>
<text x="70" y="206" font-size="23" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="104" y="198" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Haz un nudo simple flojo</text>
<text x="104" y="224" font-size="17" fill="#5a6470" text-anchor="start">A unos 10 cm de la punta. No lo aprietes.</text>
<path d="M80 335 L300 335 C 335 335, 360 305, 340 277 C 320 253, 280 269, 292 297 C 300 317, 318 329, 350 335" fill="none" stroke="#3d6e91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
