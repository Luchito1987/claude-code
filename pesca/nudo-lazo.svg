<text x="205" y="1200" font-size="16" fill="#d6453d" text-anchor="middle" font-weight="bold">3 vueltas</text>
<rect x="30" y="1240" width="740" height="255" rx="16" fill="#fff" stroke="#e1dbcf" stroke-width="2"/>
<circle cx="70" cy="1278" r="21" fill="#d6453d"/>
