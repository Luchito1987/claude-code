<text x="376" y="1755" font-size="16" fill="#d6453d" text-anchor="middle" font-weight="bold">lazo 0,5–1 cm</text>
<path d="M200 1655 L110 1655" fill="none" stroke="#d6453d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
