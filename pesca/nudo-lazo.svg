<text x="104" y="1008" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Enrolla la punta 3 veces en el nylon</text>
<text x="104" y="1034" font-size="17" fill="#5a6470" text-anchor="start">Con 60 lb bastan 2–3 vueltas.</text>
