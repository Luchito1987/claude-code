<text x="104" y="468" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Pasa la punta por el ojo del señuelo</text>
<text x="104" y="494" font-size="17" fill="#5a6470" text-anchor="start">Y regrésala hacia el nudo.</text>
<path d="M80 605 L300 605 C 335 605, 360 575, 340 547 C 320 523, 280 539, 292 567 C 300 587, 318 599, 350 605" fill="none" stroke="#3d6e91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M612 575 Q 640 571 790 579 L 790 631 Q 640 639 612 635 Z" fill="#e8ecef" stroke="#a9b0b6" stroke-width="3"/>
<rect x="608" y="575" width="12" height="60" rx="5" fill="#d64b45"/>
