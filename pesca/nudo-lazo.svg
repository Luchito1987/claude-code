<text x="104" y="1278" font-size="22" fill="#1f2a36" text-anchor="start" font-weight="bold">Vuelve a pasar la punta por el nudo simple</text>
<text x="104" y="1304" font-size="17" fill="#5a6470" text-anchor="start">Por el mismo lado por donde salió.</text>
<path d="M80 1415 L300 1415 C 335 1415, 360 1385, 340 1357 C 320 1333, 280 1349, 292 1377 C 300 1397, 318 1409, 350 1415" fill="none" stroke="#3d6e91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
